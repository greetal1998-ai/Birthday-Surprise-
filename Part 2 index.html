<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="stylesheet" href="Style2.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="poster" id="poster">
        <!-- Music Control -->
    <div id="musicControl">

        <span id="musicText">Play</span>

        <button id="musicBtn" onclick="toggleMusic()">🎵</button>

    </div>
    
    <!-- Birthday Heading -->
    <div class="birthday-heading">
        <span>Happy</span>
        <span class="age">30</span>
        <span class="th">th</span>
        <span>Birthday</span>
    </div>

    <!-- Photo -->
    <div class="photo-frame">
        <img src="He.jpg" alt="Hari">
        <h3>Hariii! ❤</h3>
    </div>
    <!-- Wish -->
    <p class="wish">
        "May all your wishes come true...<br>
        have a good health, wealth and happiness...!"
    </p>
    <!-- Space for future button -->
    <div class="more-section">

    <p>Seri… next-ku polaama?</p>

    <button onclick="goToNextPage()">
        Touch me 😉
    </button>

</div>
</div>
    
<!-- Birthday Song -->

<audio id="birthdaySong" src="Bsong.mp3" loop></audio>
    
<script src="Script2.js"></script>
</body>
</html>
